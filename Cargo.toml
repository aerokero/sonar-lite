[package]
name = "sonar-lite"
version = "0.1.1"
edition = "2021"

[dependencies]
winreg = "0.52"
cpal = "0.15"
nnnoiseless = { version = "0.5", default-features = false }
tray-icon = { version = "0.19", default-features = false }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Threading", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Foundation", "Win32_System_SystemInformation", "Foundation", "Media_Control", "Foundation_Collections"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
